<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Autumn Code Walk</title>
        <link rel="stylesheet" href="/style.css" />
        <script data-goatcounter="https://autumncodewalk.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    </head>
    <body>
        <h1>
            <a href="/" class="header">~AUTUMN C<span class="orange">O</span>DE WALK~</a>
        </h1>
        <header>
            <nav>
                <div class="container">
                    <a href="/profile/" class="nav-bar username">user</a>
                    <div class="right-links">
                        <a href="/about/" class="nav-bar">About</a>
                        <a href="/statistics/" class="nav-bar">Statistics</a>
                    </div>
                </div>
            </nav>
            <hr />
        </header>
        <main>
            <h3>Problem 0</h3>
            <p>You are given a list of numbers and need to add them together.</p>

            <h4>Input format</h4>
            <p>The input is a space-separated list of positive integers.</p>
            <h4>Output format</h4>
            <p>The sum of the integers.</p>
            <h4>Sample input</h4>
            <pre><code>1 1</code></pre>
            <h4>Sample output</h4>
            <pre><code>2</code></pre>

            <br />

            <p>
                <strong><a href="input.txt">Your input</a></strong>
            </p>
            <br />

            <form id="submit-form">
                <label for="output"><strong>Your output</strong>:</label>
                <input id="output" name="output" required autocomplete="off" />
                <input type="submit" value="Submit" />
            </form>
            <p id="submit-feedback"></p>
        </main>
        <script type="module" src="/script.js"></script>
    </body>
</html>
